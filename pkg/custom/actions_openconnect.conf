[stop]
command:/usr/local/etc/rc.d/opnsense-openconnect onestop >/dev/null 2>&1; echo OK
parameters:
type:script_output
message:stop openconnect

[start]
command:/usr/local/opnsense/scripts/OPNsense/Openconnect/generate_certs.php >/dev/null 2>&1; /usr/local/etc/rc.d/opnsense-openconnect onestart >/dev/null 2>&1; echo OK
parameters:
type:script_output
message:start openconnect

[restart]
command:/usr/local/etc/rc.d/opnsense-openconnect onestop >/dev/null 2>&1; /usr/local/opnsense/scripts/OPNsense/Openconnect/generate_certs.php >/dev/null 2>&1; /usr/local/etc/rc.d/opnsense-openconnect onestart >/dev/null 2>&1; echo OK
parameters:
type:script_output
message:restart openconnect

[sync]
command:/usr/local/opnsense/scripts/OPNsense/Openconnect/generate_certs.php >/dev/null 2>&1; /usr/local/opnsense/scripts/OPNsense/Openconnect/run_instances.py sync >/dev/null 2>&1; echo OK
parameters:
type:script_output
message:sync openconnect instances

[status]
command:/usr/local/etc/rc.d/opnsense-openconnect status; exit 0
parameters:
type:script_output
message:openconnect status
